apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: default
  labels:
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: mariadb
        image: docker.io/samarsassi/mariadb:latest
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root"
        - name: MYSQL_DATABASE
          value: "recrutement2"
        volumeMounts:
        - name: database-data
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command: ["mariadb-admin","--protocol=tcp","-uroot","-proot","ping"]
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["mariadb-admin","--protocol=tcp","-uroot","-proot","ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: database-data
        persistentVolumeClaim:
          claimName: database-pvc
