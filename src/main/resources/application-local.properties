spring.application.name=Recrutement

# Local datasource
spring.datasource.url=jdbc:mariadb://localhost:2025/recrutement2?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8089

# Logging
logging.level.com.zaxxer.hikari=warn
logging.level.org.springframework=warn
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{60} - %msg%n
logging.file.name=${LOGGING_FILE_NAME:/app/logs/application.log}

# OAuth2 Resource Server (same Keycloak for local)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9002/realms/PFE
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

# JWT Auth Converter
jwt.auth.converter.resource-id=recrutement-rest-api
jwt.auth.converter.principle-attribute=preferred_username

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
