spring.application.name=Recrutement
#spring.datasource.url=jdbc:mariadb://localhost:2025/recrutement2?createDatabaseIfNotExist=true
#spring.datasource.url=jdbc:mariadb://localhost:3306/recrutement2?createDatabaseIfNotExist=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/recrutement2?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8089
# Logging configuration
        # spring.jpa.show-sql=true
        # spring.jpa.properties.hibernate.format_sql=true
        # logging.level.org.hibernate.SQL=DEBUG
        # logging.level.org.hibernate.type.descriptor.sql=TRACE

logging.level.com.zaxxer.hikari=warn
logging.level.org.springframework=warn
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{60} - %msg%n
logging.file.name=${LOGGING_FILE_NAME:/app/logs/application.log}

# Spring Security OAuth2 Resource Server Configuration
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9092/realms/PFE
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.56.1:9092/realms/PFE
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/PFE
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

# JWT Auth Converter Configuration
jwt.auth.converter.resource-id=recrutement-rest-api
jwt.auth.converter.principle-attribute=preferred_username
# File upload size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
