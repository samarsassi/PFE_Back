spring.application.name=Recrutement

# Use MariaDB if provided via env (CI service), otherwise fall back to H2 for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:recrutement;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Use generic dialects that work for both
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Disable external integrations for tests
spring.mail.host=invalid
spring.mail.username=
spring.mail.password=

# Relax security for tests (resource server disabled)
spring.main.allow-bean-definition-overriding=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=


